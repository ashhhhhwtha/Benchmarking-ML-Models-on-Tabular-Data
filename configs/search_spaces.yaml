linear:
  classification:
    C: {type: loguniform, low: 1.0e-4, high: 100}
  regression:
    alpha: {type: loguniform, low: 1.0e-3, high: 1000}
rf:
  n_estimators: {type: int, low: 100, high: 500}
  max_depth: {type: choice, values: [4, 8, 12, 16, 24, null]}
  min_samples_leaf: {type: int, low: 1, high: 20}
  max_features: {type: choice, values: [sqrt, 0.5, 1.0]}
xgb:
  learning_rate: {type: loguniform, low: 0.01, high: 0.3}
  max_depth: {type: int, low: 2, high: 10}
  subsample: {type: uniform, low: 0.5, high: 1.0}
  colsample_bytree: {type: uniform, low: 0.5, high: 1.0}
  min_child_weight: {type: loguniform, low: 1, high: 20}
  reg_alpha: {type: loguniform, low: 1.0e-8, high: 10}
  reg_lambda: {type: loguniform, low: 1.0e-3, high: 10}
mlp:
  depth: {type: int, low: 1, high: 4}
  width: {type: choice, values: [64, 128, 256, 512]}
  dropout: {type: uniform, low: 0.0, high: 0.5}
  lr: {type: loguniform, low: 1.0e-4, high: 3.0e-3}
  weight_decay: {type: loguniform, low: 1.0e-6, high: 1.0e-2}
  batch_size: {type: choice, values: [128, 256, 512]}
fttransformer:
  n_blocks: {type: int, low: 1, high: 4}
  d_block: {type: choice, values: [32, 64, 96, 128]}
  attention_dropout: {type: uniform, low: 0.0, high: 0.5}
  ffn_dropout: {type: uniform, low: 0.0, high: 0.5}
  residual_dropout: {type: uniform, low: 0.0, high: 0.2}
  lr: {type: loguniform, low: 1.0e-5, high: 3.0e-3}
  weight_decay: {type: loguniform, low: 1.0e-6, high: 1.0e-3}
  batch_size: {type: choice, values: [256, 512]}